---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - externaldns.k8s.io
  resources:
  - dnsendpoints
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses
  - gateways
  - httproutes
  - referencegrants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kflared.kodeblox.com
  resources:
  - cloudflaretunnelbindings
  - cloudflaretunnelprivateroutes
  - clustercloudflareproviders
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - kflared.kodeblox.com
  resources:
  - cloudflaretunnelbindings/finalizers
  - cloudflaretunnelprivateroutes/finalizers
  - clustercloudflareproviders/finalizers
  verbs:
  - update
- apiGroups:
  - kflared.kodeblox.com
  resources:
  - cloudflaretunnelbindings/status
  - cloudflaretunnelprivateroutes/status
  - clustercloudflareproviders/status
  verbs:
  - get
  - patch
  - update
