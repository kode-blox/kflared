name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'LICENSE*'
      - '.idea/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      security-events: write
    uses: $/.github/workflows/ci.yaml

  detect-delivery-changes:
    name: Detect Delivery Changes
    permissions:
      contents: read
    uses: $/.github/workflows/detect-delivery-changes.yaml

  deliver-documentation:
    name: Deliver Documentation
    if: needs.detect-delivery-changes.outputs.documentation-changed == 'true'
    needs:
      - detect-delivery-changes
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/deliver-documentation.yaml

  validate-container:
    name: Validate Container
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs:
      - ci
    permissions:
      contents: read
    uses: $/.github/workflows/validate-container.yaml
    with:
      application-version: ${{ needs.ci.outputs.application-version }}

  deliver-development:
    name: Deliver Development
    if: >-
      github.event_name == 'push' &&
      (needs.detect-delivery-changes.outputs.application-changed == 'true' ||
      needs.detect-delivery-changes.outputs.chart-changed == 'true')
    needs:
      - ci
      - detect-delivery-changes
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/deliver-development.yaml
    with:
      deliver-application: ${{ needs.detect-delivery-changes.outputs.application-changed == 'true' }}
      deliver-chart: ${{ needs.detect-delivery-changes.outputs.chart-changed == 'true' }}
      application-version: ${{ needs.ci.outputs.application-version }}
    secrets:
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

  release-eligibility:
    name: Release Eligibility
    if: needs.detect-delivery-changes.outputs.application-release-requested == 'true' || needs.detect-delivery-changes.outputs.chart-release-requested == 'true'
    needs:
      - detect-delivery-changes
      - deliver-development
    permissions:
      contents: read
    uses: $/.github/workflows/release-eligibility.yaml
    with:
      application-release-requested: ${{ needs.detect-delivery-changes.outputs.application-release-requested == 'true' }}
      chart-release-requested: ${{ needs.detect-delivery-changes.outputs.chart-release-requested == 'true' }}

  deliver-production:
    name: Deliver Production
    if: needs.release-eligibility.outputs.release-needed == 'true'
    needs:
      - deliver-development
      - release-eligibility
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/deliver-production.yaml
    with:
      source-digest: ${{ needs.deliver-development.outputs.image-digest }}
      deliver-application: ${{ needs.release-eligibility.outputs.application-release-needed == 'true' }}
      deliver-chart: ${{ needs.release-eligibility.outputs.chart-release-needed == 'true' }}
      application-version: ${{ needs.release-eligibility.outputs.application-version }}
      chart-version: ${{ needs.release-eligibility.outputs.chart-version }}
    secrets:
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

  release-records:
    name: Create Release Records
    needs:
      - release-eligibility
      - deliver-production
    permissions:
      contents: write
      id-token: write
    uses: $/.github/workflows/create-release-records.yaml
    with:
      application-release-needed: ${{ needs.release-eligibility.outputs.application-release-needed == 'true' }}
      chart-release-needed: ${{ needs.release-eligibility.outputs.chart-release-needed == 'true' }}
      application-version: ${{ needs.release-eligibility.outputs.application-version }}
      chart-version: ${{ needs.release-eligibility.outputs.chart-version }}
