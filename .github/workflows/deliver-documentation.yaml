name: Deliver Documentation

on:
  workflow_call:
    secrets:
      GITOPS_APP_PRIVATE_KEY:
        description: GitHub App private key used to update the GitOps repository
        required: true
    outputs:
      image-tag:
        description: Published documentation image tag
        value: ${{ jobs.prepare-documentation.outputs.image-tag }}
      image-digest:
        description: Published documentation image digest
        value: ${{ jobs.prepare-documentation.outputs.image-digest }}

permissions: {}

jobs:
  build-documentation:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout and install Node dependencies
        uses: SayakMukhopadhyay/github-actions/checkout-dependencies@v1
        with:
          node-version-file: .nvmrc

      - name: Lint documentation site
        run: npm run lint --workspace @kode-blox/kflared-docs

      - name: Check documentation types
        run: npm run types:check --workspace @kode-blox/kflared-docs

      - name: Build documentation site
        run: npm run build --workspace @kode-blox/kflared-docs

      - name: Validate generated site
        uses: SayakMukhopadhyay/github-actions/validate-static-site@v1
        with:
          path: docs/out

  prepare-documentation:
    name: Prepare Documentation
    needs:
      - build-documentation
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/prepare-documentation.yaml

  deploy-documentation:
    name: Deploy Documentation
    if: needs.prepare-documentation.outputs.image-tag != ''
    needs:
      - prepare-documentation
    permissions:
      packages: read
    uses: $/.github/workflows/deploy.yaml
    with:
      deployment-environment: documentation
      chart-name: kflared
      dependency: staticSites
      image-tag: ${{ needs.prepare-documentation.outputs.image-tag }}
    secrets:
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
