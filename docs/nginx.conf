server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location = /api/search {
        default_type application/json;
        try_files $uri =404;
    }

    location ~ ^/llms\.mdx/docs/.+/content\.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    location ~ ^/(.+)/$ {
        return 308 /$1$is_args$args;
    }

    location / {
        try_files $uri.html $uri $uri/index.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
