{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "kflared.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kflared.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStore is required when externalSecrets.enabled=true" .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "kflared.secretName" . }}
  data:
    {{- required "externalSecrets.secrets must contain at least one mapping when externalSecrets.enabled=true" .Values.externalSecrets.secrets | toYaml | nindent 4 }}
{{- end }}
