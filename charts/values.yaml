# Default values for KFlared.

replicaCount: 1

image:
  repository: ghcr.io/kode-blox/kflared
  pullPolicy: IfNotPresent
  tag: ""

kubernetesComponent: controller-manager

# Ownership class; must match spec.controller on managed resources.
controllerClass: kflared

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

namespace:
  create: false
  labels: {}
  annotations: {}

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  create: true
  helperRoles:
    enabled: false

# Optionally create the Cloudflare API token Secret through External Secrets Operator.
# External Secrets Operator and a ClusterSecretStore must already be installed.
externalSecrets:
  enabled: false
  secretStore: ""
  refreshInterval: 1h
  targetSecretName: cloudflare-api-token
  secrets: []
  # - secretKey: api-token
  #   remoteRef:
  #     key: kflared/cloudflare-api-token

# Optionally create the cluster-scoped Cloudflare provider managed by this KFlared release.
# The API token Secret is expected in the release namespace. Its name defaults to
# externalSecrets.targetSecretName, so this also supports an administrator-managed Secret.
clusterCloudflareProvider:
  enabled: false
  # Defaults to the chart fullname. Set a stable unique value when multiple releases share a cluster.
  name: ""
  accountID: ""
  apiTokenSecretRef:
    # Defaults to externalSecrets.targetSecretName.
    name: ""
    key: api-token
  allowedDNSZones: []
  # An empty selector ({}) intentionally permits bindings from every namespace.
  bindingNamespaceSelector: {}

leaderElection:
  enabled: true

metrics:
  enabled: true
  secure: true
  port: 8443
  service:
    annotations: {}

serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s
  scrapeTimeout: 10s

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: health
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10

terminationGracePeriodSeconds: 10

extraArgs: []
extraEnv: []
volumes: []
volumeMounts: []

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
